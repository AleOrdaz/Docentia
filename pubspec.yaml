name: docentia
description: "Docentia - Aplicación móvil Flutter completa para gestión académica, control de asistencia y tutores con diseño fiel de Google Stitch."
publish_to: 'none'
version: 1.0.0+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.1
  google_fonts: ^6.2.1
  url_launcher: ^6.2.6
  shared_preferences: ^2.2.3
  intl: ^0.20.2
  flutter_svg: ^2.0.10+1
  cupertino_icons: ^1.0.6
  firebase_core: ^4.15.0
  firebase_auth: ^6.7.0
  image_picker: ^1.1.2
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/images/logo.jpeg
    - assets/images/logo.png
    - assets/images/logo_info.png
    - assets/images/logo_info.jpeg
    - assets/images/home_greeting.png
    - assets/icons/
